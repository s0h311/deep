<main class="mx-auto grid max-w-7xl grid-cols-1 gap-6 p-6 lg:grid-cols-[16rem_minmax(0,1fr)_18rem]">
  <aside class="space-y-6">
    <app-stepper [state]="research.state()" />
    <section>
      <h2 class="text-sm font-medium text-muted">Artifacts</h2>
      <ul class="mt-2 space-y-1">
        @for (name of research.artifacts(); track name) {
        <li class="font-mono text-sm">{{ name }}</li>
        }
      </ul>
    </section>
  </aside>
  <section class="flex min-h-64 flex-col gap-4 rounded-lg border border-line bg-elevated p-6">
    @if (research.state().status === 'none') {
    <h1 class="text-xl font-semibold">What do you want to research?</h1>
    } @else if (research.grillingTranscript(); as transcript) {
    <app-grilling-thread
      [transcript]="transcript"
      [answerable]="research.state().status === 'awaiting_answer'"
      [disabled]="research.busy()"
      (recommendationUsed)="send($event)"
    />
    }
    <form
      class="mt-auto flex items-end gap-2"
      (submit)="sendTyped($event)"
    >
      <textarea
        name="message"
        rows="2"
        aria-label="Message"
        class="min-w-0 flex-1 resize-none rounded-md border border-line bg-bg px-3 py-2 text-sm focus:border-accent focus:outline-none disabled:bg-surface disabled:text-muted"
        [value]="message()"
        [disabled]="research.busy()"
        (input)="message.set($any($event.target).value)"
      ></textarea>
      <button
        type="submit"
        class="rounded-md bg-accent px-4 py-2 text-sm font-medium text-white disabled:opacity-50"
        [disabled]="research.busy()"
      >
        Send
      </button>
    </form>
  </section>
  <aside class="rounded-lg border border-line bg-surface p-4"></aside>
</main>
