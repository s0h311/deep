<main class="mx-auto grid max-w-7xl grid-cols-1 gap-6 p-6 lg:grid-cols-[16rem_minmax(0,1fr)_18rem]">
  <aside class="space-y-6">
    <app-stepper [state]="research.state()" />
    <section>
      <h2 class="text-sm font-medium text-muted">Artifacts</h2>
      <ul class="mt-2 space-y-1">
        @for (name of research.artifacts(); track name) {
        <li class="font-mono text-sm">{{ name }}</li>
        }
      </ul>
    </section>
  </aside>
  <section class="min-h-64 rounded-lg border border-line bg-elevated p-6"></section>
  <aside class="rounded-lg border border-line bg-surface p-4"></aside>
</main>
