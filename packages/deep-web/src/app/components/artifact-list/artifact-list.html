<h2 class="text-sm font-medium text-muted">Artifacts</h2>
<ul class="mt-2 space-y-1">
  @for (artifact of artifacts(); track artifact.name) {
  <li>
    <button
      type="button"
      class="flex w-full items-center justify-between gap-2 rounded-md px-3 py-1.5 text-left text-sm hover:bg-surface"
      [class.bg-accent-soft]="artifact.name === selected()"
      [attr.aria-current]="artifact.name === selected() ? 'true' : null"
      (click)="opened.emit(artifact.name)"
    >
      <span>{{ artifact.label }}</span>
      @if (artifact.verdict) {
      <span
        class="rounded-full px-2 text-xs font-medium"
        [class]="artifact.verdict === 'pass' ? 'bg-accent text-white' : 'border border-line text-muted'"
        >{{ artifact.verdict === 'pass' ? 'Pass' : 'Fail' }}</span
      >
      }
    </button>
  </li>
  }
</ul>
